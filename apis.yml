aid: cerenovus
name: Cerenovus
description: >-
  Cerenovus Inc. (cerenovus.ai) is a San Francisco AI software company backed by Y
  Combinator (S26 batch). Cerenovus is both the company and the product — earlier
  product names have been retired, and Compendium is its internal workspace rather than
  a public offering. It reads the records an organization already produces (email,
  contracts, invoices, ledgers, tickets, calendars, meeting notes and documents),
  resolves the same customer, vendor or person across systems into one entity, runs
  deterministic scans for countable problems such as duplicate payments, dormant
  vendors and missed discount windows, then uses models to investigate what the scans
  surface and returns ranked findings with every claim cited back to the source record.
  It is sold as eight standalone engagements — operational due diligence, value
  creation plan, post-merger integration, exit readiness, operational diagnostic,
  decision intelligence, operational foresight and early warning, and spend and vendor
  intelligence — to enterprises, middle-market companies, private equity firms,
  consulting and advisory firms, and corporate development teams. Cerenovus publishes
  no developer portal, API reference or machine-readable specification; the only
  machine surface found is an undocumented, OAuth-protected remote MCP server at
  api.cerenovus.ai/mcp. Not affiliated with the similarly named Johnson & Johnson
  MedTech neurovascular device business.
