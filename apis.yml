aid: cerenovus
name: Cerenovus
description: >-
  Cerenovus (cerenovus.ai) is a San Francisco AI software company backed by Y
  Combinator (Summer 2026 batch), founded in 2026 by a team out of Harvard and
  NYU Stern. It builds "the AI company brain" — software that reads everything a
  company produces (email, chat, documents, CRM, ERP, tickets, meeting notes)
  and returns findings with citations back to the source. Its products are
  Noesis (the enterprise flagship company brain built for CEOs, CFOs, and
  private-equity operating partners), Midas (an AI sales platform that runs
  inside a company's existing CRM and is paid out of the revenue it produces),
  and Compendium (shared real-time context and durable memory for engineering
  and customer-facing teams and their AI agents, including shared Claude Code
  sessions). Cerenovus is not affiliated with the similarly named Johnson &
  Johnson MedTech neurovascular device business.
