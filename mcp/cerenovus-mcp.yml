note: >-
  A real, hosted, remote MCP server runs at https://api.cerenovus.ai/mcp. It was found
  by probing the API host discovered from DNS (api.cerenovus.ai is a CNAME to
  cerenovus-backend.onrender.com), not from any Cerenovus documentation — the company
  publishes no developer portal, no API reference, and no mention of this endpoint on
  cerenovus.ai. The endpoint is OAuth-protected and answers an unauthenticated
  tools/list with HTTP 401 and a spec-correct WWW-Authenticate challenge carrying a
  resource_metadata pointer, so the live tool list and per-tool inputSchemas require
  authenticated introspection. NO TOOL LIST IS RECORDED HERE because none could be
  read; the scopes below are the provider's own published scope vocabulary from its
  anonymous discovery documents, and they are the only evidence of what the server
  exposes.
